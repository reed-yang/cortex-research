<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17211e" />
    <title>Cortex — Offline</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); color: #18201d; background: #f5f3ec; }
      main { width: min(100%, 420px); padding: 28px; border: 1px solid #d8d5ca; border-radius: 18px; background: #fffdf7; box-shadow: 0 18px 45px rgba(35, 45, 40, 0.08); }
      .mark { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: #fffdf7; background: #23453a; font-weight: 750; letter-spacing: 0.04em; }
      h1 { margin: 22px 0 8px; font-family: Georgia, serif; font-size: 30px; line-height: 1.08; }
      p { margin: 0; color: #52605a; font-size: 15px; line-height: 1.6; }
      .retry { min-width: 44px; min-height: 44px; width: max-content; margin-top: 22px; display: grid; place-items: center; padding: 10px 16px; border-radius: 10px; color: white; background: #23453a; font: inherit; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">CX</div>
      <h1>Cortex is offline</h1>
      <p>No research state is stored in this offline page, and no action will be queued. Reconnect to reopen the canonical workspace.</p>
      <a class="retry" href="/">Try again</a>
    </main>
  </body>
</html>
