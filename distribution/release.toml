# The one checked-in input that selects a release composition.
#
# Only independently chosen values live here. Everything else -- source commit,
# bundle digest, Web build identity, Hermes upstream version, worker sequence and
# session schema -- is derived from the actual source and artifacts when the
# release record is generated, and a disagreement is refused rather than
# recorded. See `distribution/release_record.py`.
#
# This file is a build input, not installed state: it never names a generation
# directory, and `product.version` is the public product version, which is a
# different thing from the installer pointer's `version` field.

format_version = 1

[product]
version = "0.1.20-a1"
release_id = "cortex-auto-research-19-local"
release_sequence = 19

[control]
target_schema = 19
upgrade_from_schemas = [16, 17, 18]

[worker]
release_id = "hermes-0.15.0-gen9"
adapter_protocol = "cortex-worker/2"
