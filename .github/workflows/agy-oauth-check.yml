# Reuse the same original encrypted refresh token on two fresh hosted VMs.
name: agy OAuth check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment: pr-review
    timeout-minutes: 8
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        session: [1, 2]
    concurrency:
      group: agy-subscription-account
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install verified official agy
        run: python3 tools/pr_review/install_agy.py --out "$RUNNER_TEMP/agy-bin/agy"
      - name: Verify native renewal and a single review turn
        env:
          AGY_BIN: ${{ runner.temp }}/agy-bin/agy
          AGY_WORK_ROOT: ${{ runner.temp }}/agy-state
          AGY_OAUTH_JSON: ${{ secrets.AGY_OAUTH_JSON }}
          GEMINI_MODEL: ${{ vars.AGY_MODEL }}
        run: python3 tools/pr_review/agy_auth.py check
      - name: Remove private native state
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/agy-state"
