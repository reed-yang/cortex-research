# Reuse the same original encrypted refresh token on two fresh hosted VMs.
name: agy OAuth check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment: pr-review
    timeout-minutes: 8
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        session: [1, 2]
    concurrency:
      group: agy-subscription-account
      cancel-in-progress: false
    steps:
      - name: Verify native renewal and a single review turn
        uses: reed-yang/independent-pr-review@19c1e07929adc4f052818385147c04058537259d
        with:
          phase: auth-check
          output: ${{ runner.temp }}/review-auth-check
        env:
          AGY_OAUTH_JSON: ${{ secrets.AGY_OAUTH_JSON }}
          GEMINI_MODEL: ${{ vars.AGY_MODEL }}
