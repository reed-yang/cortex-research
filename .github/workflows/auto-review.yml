name: Independent PR review
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, converted_to_draft, closed, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number
        required: true
        type: number
      mode:
        description: Review mode
        type: choice
        default: dry-run
        options: [dry-run, review, full]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: independent-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false
jobs:
  review:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'workflow_dispatch' || vars.AUTO_REVIEW_ENABLED == 'true') &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request && startsWith(github.event.comment.body, '/review') && github.event.comment.user.type != 'Bot')) &&
      (github.event_name != 'pull_request_target' || github.event.pull_request.user.login != 'dependabot[bot]')
    # Reviewed standalone release; project policy and Secrets stay in Cortex.
    uses: reed-yang/independent-pr-review/.github/workflows/review.yml@61a6b52e9dfc7b1e48684a250a91d4626dc0e459 # v0.4.0
    with:
      pr_number: ${{ inputs.pr_number && format('{0}', inputs.pr_number) || '' }}
      mode: ${{ inputs.mode || 'review' }}
    # Explicit names enable protected Environment resolution in the called jobs.
    secrets:
      REVIEW_STATE_KEY: ${{ secrets.REVIEW_STATE_KEY }}
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      GPT_API_KEY: ${{ secrets.GPT_API_KEY }}
