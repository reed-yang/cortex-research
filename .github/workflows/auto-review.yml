# Repository tooling only. PR head content is fetched as data, never executed.
# Gemini is unavailable until agy subscription authentication is qualified.
# Both activation and publishing default to off. Use standard Ubuntu runners.
name: Independent PR review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: number
      mode:
        description: Collect input only, or call configured reviewers
        required: true
        default: dry-run
        type: choice
        options: [dry-run, review]

permissions:
  contents: read

concurrency:
  group: independent-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref_name == github.event.repository.default_branch &&
       (inputs.mode == 'dry-run' || vars.AUTO_REVIEW_ENABLED == 'true')) ||
      (github.event_name == 'pull_request_target' && vars.AUTO_REVIEW_ENABLED == 'true' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.base.ref == github.event.repository.default_branch &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.target.outputs.pr_number }}
    steps:
      # Trusted base only. PR code is fetched as API data, never checked out.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Resolve PR number
        id: target
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          python3 - <<'PY'
          import os
          number = int(os.environ['PR_NUMBER'])
          if number <= 0:
              raise ValueError('A positive PR number is required')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'pr_number={number}\n')
          PY
      - name: Collect immutable review packet
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_REPO: ${{ github.repository }}
          REVIEW_PR: ${{ steps.target.outputs.pr_number }}
          REVIEW_BASE: ${{ github.event.repository.default_branch }}
        run: >-
          python3 tools/pr_review/review.py prepare
          --repo "$REVIEW_REPO" --pr "$REVIEW_PR" --base-branch "$REVIEW_BASE"
          --rules tools/pr_review/cortex-rules.md
          --out "$RUNNER_TEMP/review-output/packet.json"
      - name: Dry run without model credentials
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'
        env:
          GROK_BASE_URL: ${{ vars.GROK_BASE_URL }}
          GROK_MODEL: ${{ vars.GROK_MODEL }}
        run: >-
          python3 tools/pr_review/review.py run --dry-run
          --packet "$RUNNER_TEMP/review-output/packet.json"
          --config tools/pr_review/backends.json
          --out "$RUNNER_TEMP/review-output/result.json"
      - name: Run independent reviewers
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'review'
        env:
          GROK_BASE_URL: ${{ vars.GROK_BASE_URL }}
          GROK_MODEL: ${{ vars.GROK_MODEL }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: >-
          python3 tools/pr_review/review.py run
          --packet "$RUNNER_TEMP/review-output/packet.json"
          --config tools/pr_review/backends.json
          --out "$RUNNER_TEMP/review-output/result.json"
      - name: Show actual review status
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib
          report = pathlib.Path(os.environ['RUNNER_TEMP']) / 'review-output/result.md'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(report.read_text() if report.exists() else 'Review did not complete. Inspect the failed step.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: independent-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/review-output/result.json
            ${{ runner.temp }}/review-output/result.md
          if-no-files-found: warn
          retention-days: 3

  publish:
    needs: review
    if: >-
      always() && !cancelled() &&
      needs.review.outputs.pr_number != '' && vars.AUTO_REVIEW_PUBLISH == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.mode == 'review')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: independent-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-result
      - name: Publish to the expected PR at the reviewed SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_REPO: ${{ github.repository }}
          REVIEW_PR: ${{ needs.review.outputs.pr_number }}
        run: >-
          python3 tools/pr_review/review.py publish
          --repo "$REVIEW_REPO" --pr "$REVIEW_PR"
          --result "$RUNNER_TEMP/review-result/result.json"
